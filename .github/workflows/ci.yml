name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, tests, build, E2E (réseau simulé)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build (catalogue + typecheck + Vite)
        run: npm run build

      - name: Navigateur Playwright et xmllint
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Schéma officiel GPX 1.1 (validation de l'export)
        run: |
          mkdir -p tests/.generated
          curl -fsSL --retry 3 https://www.topografix.com/GPX/1/1/gpx.xsd -o tests/.generated/gpx.xsd
          head -c 300 tests/.generated/gpx.xsd

      - name: Tests de bout en bout (réseau simulé)
        run: npx playwright test
        env:
          CI: 'true'
          GPX_XSD: tests/.generated/gpx.xsd

      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Build statique (dist)
        uses: actions/upload-artifact@v4
        with:
          name: tmb-trip-planner-dist
          path: dist
          retention-days: 30

  e2e-live:
    name: E2E en conditions réelles (tuiles, BRouter, Open-Meteo)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: tmb-trip-planner-dist
          path: dist

      - run: npx playwright install --with-deps chromium

      - name: Tests en conditions réelles
        run: npx playwright test -c playwright.live.config.ts
        env:
          CI: 'true'

      - name: Rapport et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            playwright-report-live
            test-results
          retention-days: 14
